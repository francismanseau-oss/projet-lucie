# ═══════════════════════════════════════════════════════════
# Worker TEST / préproduction — DISTINCT de la production
# ═══════════════════════════════════════════════════════════
# Usage local :
#   npx wrangler dev -c wrangler.test.toml
# Déploiement TEST (seulement après autorisation explicite) :
#   npx wrangler deploy -c wrangler.test.toml
#
# Ce fichier ne remplace PAS wrangler.toml (dev local générique).
# Production = autre Worker / autre config — jamais mélanger les secrets.

name = "fourrures-boreales-checkout-test"
main = "src/index.js"
compatibility_date = "2024-11-01"

# KV TEST (créer séparément de la prod) — idempotence webhooks SEULEMENT :
#   npx wrangler kv namespace create ORDERS_TEST
# [[kv_namespaces]]
# binding = "ORDERS"
# id = "REPLACE_TEST_NAMESPACE_ID"
# preview_id = "REPLACE_TEST_PREVIEW_ID"

# D1 TEST — stocks / réservations atomiques (PAS KV) :
#   npx wrangler d1 create boreales-inventory-test
# [[d1_databases]]
# binding = "DB"
# database_name = "boreales-inventory-test"
# database_id = "REPLACE_AFTER_CREATE"

[vars]
# Environnement figé en test — le code refuse sk_live si WORKER_ENV=test
WORKER_ENV = "test"
FORCE_TEST_KEYS_ONLY = "true"
SITE_ORIGIN = "http://127.0.0.1:5500"
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8787,https://francismanseau-oss.github.io"
PUBLIC_SITE_URL = "http://127.0.0.1:5500"
ALLOW_TEST_CHECKOUT = "true"
PRODUCTION_UNLOCKED = "false"
SHIPPING_CONFIGURED = "false"
AVAILABILITY_CONFIGURED = "false"
PACKAGE_PROFILES_CONFIGURED = "false"
COMMERCIAL_TERMS_CONFIGURED = "false"
FREE_SHIPPING_AUTHORIZED = "false"
# Phase A test seulement — production doit avoir livraison validée ou free autorisé
ALLOW_CHECKOUT_WITHOUT_SHIPPING = "true"

# Secrets TEST uniquement (Lucie les colle elle-même) :
#   wrangler secret put STRIPE_SECRET_KEY -c wrangler.test.toml
#     → sk_test_… seulement
#   wrangler secret put STRIPE_WEBHOOK_SECRET -c wrangler.test.toml
#     → whsec_… de l’endpoint test
