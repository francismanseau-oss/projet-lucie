# Dev local générique. Pour préprod TEST isolée : wrangler.test.toml
#   npx wrangler dev -c wrangler.test.toml
# Aucun deploy sans autorisation explicite.
name = "fourrures-boreales-checkout"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ─── Routes (après déploiement, compte Lucie de préférence) ───
# Worker URL typique : https://fourrures-boreales-checkout.<compte>.workers.dev
#   GET  /health
#   GET  /api/catalog          (lecture seule)
#   POST /api/checkout         (crée Session Stripe test)
#   POST /api/webhooks/stripe  (HMAC + idempotence KV)
#
# Optionnel — route custom (dashboard Cloudflare → Workers → Triggers → Routes) :
#   checkout.lesfourruresboreales.com/*  → ce Worker
# Frontend : checkout-config.js → apiBase = URL du Worker (sans slash final)

# ─── KV ORDERS (idempotence webhooks + pending sessions) ───
# Création (Lucie ou Francis infra, UNE fois) :
#   npx wrangler kv namespace create ORDERS
#   npx wrangler kv namespace create ORDERS --preview
# Puis décommenter et coller les IDs :
#
# [[kv_namespaces]]
# binding = "ORDERS"
# id = "REPLACE_WITH_PROD_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_NAMESPACE_ID"

# Variables non secrètes (OK dans git). Secrets → wrangler secret / .dev.vars
[vars]
SITE_ORIGIN = "http://127.0.0.1:5500"
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8787,https://francismanseau-oss.github.io"
PUBLIC_SITE_URL = "http://127.0.0.1:5500"
ALLOW_TEST_CHECKOUT = "true"
PRODUCTION_UNLOCKED = "false"
SHIPPING_CONFIGURED = "false"
AVAILABILITY_CONFIGURED = "false"
PACKAGE_PROFILES_CONFIGURED = "false"
COMMERCIAL_TERMS_CONFIGURED = "false"
FREE_SHIPPING_AUTHORIZED = "false"
ALLOW_CHECKOUT_WITHOUT_SHIPPING = "true"

# Secrets (NE PAS mettre ici) — via .dev.vars en local, wrangler secret en prod :
#   STRIPE_SECRET_KEY      = sk_test_…   (jamais sk_live en Phase A)
#   STRIPE_WEBHOOK_SECRET  = whsec_…     (signing secret endpoint test)
