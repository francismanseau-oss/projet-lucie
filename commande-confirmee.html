<title>Confirmation | Les Fourrures Boréales</title>

<style>
  .order-confirm-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .order-confirm-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #e8f5e9;
    border: 2px solid #4caf50;
    color: #2e7d32;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.55rem;
    line-height: 1;
  }
  .order-confirm-hero h1 {
    margin: 0;
    font-size: clamp(1.45rem, 3vw, 1.85rem);
    font-weight: 600;
    color: #2a221c;
  }
  .order-confirm-sub {
    margin: 0;
    color: #5c4f44;
    font-size: 1.05rem;
  }
  .order-number-pill {
    display: inline-block;
    margin-top: 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #f7f1ea;
    border: 1px solid #e5d8c8;
    font-weight: 700;
    letter-spacing: .04em;
    color: #2a221c;
  }
  .order-recap {
    margin: 1.25rem 0 0;
    padding: 1rem 1.1rem;
    border: 1px solid #e5d8c8;
    border-radius: 12px;
    background: #fffcf8;
    text-align: left;
  }
  .order-recap h2 {
    margin: 0 0 .75rem;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .order-lines {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: .65rem;
  }
  .order-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: .55rem;
    border-bottom: 1px solid #efe6dc;
  }
  .order-line:last-child { border-bottom: 0; padding-bottom: 0; }
  .order-line-name { font-weight: 600; color: #2a221c; }
  .order-line-meta { display: block; margin-top: 2px; font-size: .9rem; color: #7a6a5c; font-weight: 400; }
  .order-line-price { white-space: nowrap; font-weight: 600; }
  .order-totals {
    margin-top: .9rem;
    padding-top: .75rem;
    border-top: 1px solid #e5d8c8;
    font-size: .98rem;
    line-height: 1.55;
  }
  .order-totals strong { font-size: 1.12rem; }
  .order-ship-note {
    margin: .85rem 0 0;
    padding: .85rem;
    border-radius: 10px;
    background: #f3ebe3;
    border: 1px solid #e0d0c0;
    font-size: .95rem;
    line-height: 1.45;
    color: #3a2f28;
  }
  .order-status-msg { text-align: center; }
  .order-status-panel.is-waiting .order-confirm-icon,
  .order-status-panel.is-failed .order-confirm-icon { display: none; }
  .order-adapted-note {
    margin: 1.1rem 0 0;
    padding: 1rem 1.1rem;
    border-radius: 12px;
    background: #f7f1ea;
    border: 1px solid #e5d8c8;
    text-align: left;
    line-height: 1.55;
    color: #2a221c;
  }
  .order-adapted-note h2 {
    margin: 0 0 .65rem;
    font-size: 1.12rem;
    font-weight: 600;
  }
  .order-adapted-note p { margin: 0 0 .7rem; }
  .order-adapted-note p:last-child { margin-bottom: 0; }
</style>

<body class="payment-page order-status-page">
<header class="header"><a class="brand" href="index.html"><img src="assets/logo-fourrures-boreales.webp" alt="Les Fourrures Boréales" onerror="this.onerror=null;this.src='assets/logo-fourrures-boreales.png'"><span>LES FOURRURES <strong>BORÉALES</strong></span></a><button class="menu-toggle" aria-expanded="false" aria-controls="main-menu" data-fr="Menu" data-en="Menu">☰ Menu</button><nav id="main-menu" aria-label="Navigation principale"><a href="index.html" data-fr="Accueil" data-en="Home">Accueil</a><a href="boutique.html" data-fr="Boutique" data-en="Shop">Boutique</a><a href="creations-personnalisees.html" data-fr="Créations personnalisées" data-en="Custom creations">Créations personnalisées</a><a href="creations.html" data-fr="Nos créations" data-en="Our creations">Nos créations</a><a href="lucie.html" data-fr="À propos de Lucie" data-en="About Lucie">À propos de Lucie</a><a href="contact.html" data-fr="Contact" data-en="Contact">Contact</a><div class="languages mobile-languages" aria-label="Langue"><button type="button" data-set-lang="fr" aria-pressed="true">FR</button><span>|</span><button type="button" data-set-lang="en" aria-pressed="false">EN</button></div></nav><a class="cart-link" href="panier.html" aria-label="Panier"><span data-fr="Panier" data-en="Cart">Panier</span><span id="cart-count" class="cart-count-badge is-empty" data-count="0">0</span></a><div class="languages desktop-languages" aria-label="Langue"><button type="button" data-set-lang="fr" aria-pressed="true">FR</button><span>|</span><button type="button" data-set-lang="en" aria-pressed="false">EN</button></div></header>

<main>
  <section class="story payment-demo order-status-panel" id="order-panel">
    <div class="order-confirm-hero" id="order-hero" hidden>
      <span class="order-confirm-icon" aria-hidden="true">✓</span>
      <h1 id="order-title-ok">Merci pour votre commande !</h1>
      <p class="order-confirm-sub" id="order-paid-ok">Votre paiement a été confirmé.</p>
      <p class="order-number-pill" id="order-number" hidden></p>
    </div>

    <div class="page-heading" id="order-heading-alt">
      <h1 id="order-title"><span data-fr="Vérification du paiement" data-en="Payment verification">Vérification du paiement</span></h1>
    </div>
    <p id="order-status" class="order-status-msg cart-note" role="status" aria-live="polite"></p>

    <div id="order-details" class="order-recap" hidden>
      <h2 data-fr="Récapitulatif" data-en="Order summary">Récapitulatif</h2>
      <ul id="order-lines" class="order-lines"></ul>
      <div class="order-totals" id="order-totals"></div>
      <p class="order-ship-note" id="order-ship-msg" hidden></p>
      <div class="order-adapted-note" id="order-adapted-msg" hidden></div>
    </div>

    <div class="cart-actions">
      <a class="button button-ghost" href="boutique.html" data-fr="Retour à la boutique" data-en="Back to shop">Retour à la boutique</a>
      <a class="button button-ghost" href="contact.html" data-fr="Nous joindre" data-en="Contact us">Nous joindre</a>
    </div>
  </section>
</main>

<footer>© <span id="year"></span> Les Fourrures Boréales</footer>
<script src="checkout-config.js"></script>
<script src="site.js" defer></script>
<script>
(() => {
  const key = "boreales-cart";
  const en = () => document.documentElement.lang.startsWith("en");
  const panel = document.getElementById("order-panel");
  const statusEl = document.getElementById("order-status");
  const titleEl = document.getElementById("order-title");
  const hero = document.getElementById("order-hero");
  const headingAlt = document.getElementById("order-heading-alt");
  const titleOk = document.getElementById("order-title-ok");
  const paidOk = document.getElementById("order-paid-ok");
  const numberEl = document.getElementById("order-number");
  const details = document.getElementById("order-details");
  const linesEl = document.getElementById("order-lines");
  const totalsEl = document.getElementById("order-totals");
  const shipMsg = document.getElementById("order-ship-msg");
  const adaptedMsg = document.getElementById("order-adapted-msg");
  const params = new URLSearchParams(location.search);
  let sessionId = (params.get("session_id") || "").trim();
  if (sessionId === "{CHECKOUT_SESSION_ID}") sessionId = "";
  if (sessionId && !/^cs_[a-zA-Z0-9_]+$/.test(sessionId)) sessionId = "";

  function t(fr, enText) {
    return en() ? enText : fr;
  }

  function setStatus(fr, enText) {
    statusEl.textContent = t(fr, enText);
  }

  function setTitle(fr, enText) {
    titleEl.textContent = t(fr, enText);
  }

  function moneyCents(cents) {
    if (cents == null || Number.isNaN(Number(cents))) return "—";
    return (Number(cents) / 100).toFixed(2).replace(".", ",") + " $";
  }

  function clearCartIfConfirmed() {
    localStorage.removeItem(key);
    if (window.refreshCartCount) window.refreshCartCount();
  }

  function shippingCopy(methodId) {
    if (methodId === "bus_quebec") {
      return {
        fr: "Votre commande sera expédiée par Express Bus. L'adresse du point de distribution où récupérer votre colis vous sera communiquée par courriel.",
        en: "Your order will be shipped via Express Bus. The depot address where you can pick up your parcel will be shared with you by email.",
      };
    }
    if (methodId === "canada_post") {
      return {
        fr: "Votre commande sera expédiée par Postes Canada à l'adresse de livraison indiquée lors de votre commande.",
        en: "Your order will be shipped via Canada Post to the delivery address provided with your order.",
      };
    }
    return {
      fr: "Votre commande sera préparée selon les informations de livraison disponibles.",
      en: "Your order will be prepared according to the shipping details on file.",
    };
  }

  function methodLabel(id) {
    if (id === "bus_quebec") return t("Express Bus", "Express Bus");
    if (id === "canada_post") return t("Postes Canada", "Canada Post");
    return null;
  }

  function isAdaptedItem(it) {
    if (!it) return false;
    const cc = it.custom_config || {};
    return !!(
      cc.adapted_contact ||
      cc.skip_measures ||
      Number(it.product_number) === 400 ||
      Number(cc.product_number) === 400 ||
      /adaptés|adapted/i.test(String(it.name || ""))
    );
  }

  function showAdaptedNote(items) {
    if (!adaptedMsg) return;
    if (!items.some(isAdaptedItem)) {
      adaptedMsg.hidden = true;
      adaptedMsg.innerHTML = "";
      return;
    }
    adaptedMsg.hidden = false;
    titleOk.textContent = t(
      "Votre commande personnalisée est confirmée !",
      "Your custom order is confirmed!",
    );
    adaptedMsg.innerHTML =
      "<h2>" +
      t("Votre commande personnalisée est confirmée !", "Your custom order is confirmed!") +
      "</h2>" +
      "<p>" +
      t("Merci pour votre confiance !", "Thank you for your trust!") +
      "</p>" +
      "<p>" +
      t(
        "Lucie communiquera personnellement avec vous dans un délai de <strong>3 à 5 jours ouvrables</strong> afin de discuter de vos besoins et de vous guider dans la prise des mesures nécessaires.",
        "Lucie will personally contact you within <strong>3 to 5 business days</strong> to discuss your needs and guide you through taking the necessary measurements.",
      ) +
      "</p>" +
      "<p>" +
      t(
        "Chaque création est confectionnée spécialement pour vous, avec soin et attention.",
        "Each creation is made especially for you, with care and attention.",
      ) +
      "</p>" +
      "<p>" +
      t(
        "Prévoyez un délai minimum d'une semaine pour la confection, à compter de la confirmation des mesures. Ce délai peut être prolongé pendant les périodes achalandées.",
        "Allow at least one week for making, starting from measurement confirmation. This timeline may be longer during busy periods.",
      ) +
      "</p>" +
      "<p><strong>" +
      t(
        "Vous n’avez aucune démarche supplémentaire à effectuer pour le moment.",
        "You don’t need to take any further steps for now.",
      ) +
      "</strong></p>";
  }

  function showConfirmed(data) {
    panel.classList.remove("is-waiting", "is-failed");
    headingAlt.hidden = true;
    hero.hidden = false;
    titleOk.textContent = t("Merci pour votre commande !", "Thank you for your order!");
    paidOk.textContent = t("Votre paiement a été confirmé.", "Your payment has been confirmed.");
    statusEl.textContent = "";
    if (data.order_number) {
      numberEl.hidden = false;
      numberEl.textContent = t("N° de commande ", "Order no. ") + data.order_number;
    } else {
      numberEl.hidden = true;
    }

    details.hidden = false;
    linesEl.innerHTML = "";
    const items = Array.isArray(data.items) ? data.items : [];
    showAdaptedNote(items);
    if (!items.length) {
      const li = document.createElement("li");
      li.className = "order-line";
      li.textContent = t(
        "Détail des articles non disponible pour cette commande.",
        "Line items are not available for this order.",
      );
      linesEl.appendChild(li);
    } else {
      items.forEach((it) => {
        const li = document.createElement("li");
        li.className = "order-line";
        const left = document.createElement("div");
        const name = document.createElement("span");
        name.className = "order-line-name";
        name.textContent = it.name || "—";
        left.appendChild(name);
        const sizeLab = en()
          ? it.size_label_en || it.size_label_fr || it.size
          : it.size_label_fr || it.size_label_en || it.size;
        const metaBits = [];
        if (sizeLab && it.size && it.size !== "unique") {
          metaBits.push(t("Grandeur : ", "Size: ") + sizeLab);
        } else if (sizeLab && /universelle|universal/i.test(String(sizeLab))) {
          metaBits.push(sizeLab);
        }
        metaBits.push(t("Qté : ", "Qty: ") + (it.qty || 1));
        const meta = document.createElement("span");
        meta.className = "order-line-meta";
        meta.textContent = metaBits.join(" · ");
        left.appendChild(meta);
        const price = document.createElement("div");
        price.className = "order-line-price";
        price.textContent = moneyCents(it.line_total_cents);
        li.appendChild(left);
        li.appendChild(price);
        linesEl.appendChild(li);
      });
    }

    const methodId = data.shipping && data.shipping.method_id ? data.shipping.method_id : null;
    const fee = data.shipping ? data.shipping.fee_cad_cents : null;
    const products = data.products_cents;
    const total = data.amount_total;
    const mLabel = methodLabel(methodId);
    let totalsHtml =
      (en() ? "Subtotal: " : "Sous-total : ") +
      moneyCents(products) +
      "<br>" +
      (en() ? "Shipping" : "Livraison") +
      (mLabel ? " (" + mLabel + ")" : "") +
      " : " +
      moneyCents(fee) +
      "<br><strong>" +
      (en() ? "Total paid: " : "Total payé : ") +
      moneyCents(total) +
      " CAD</strong>";
    totalsEl.innerHTML = totalsHtml;

    const copy = shippingCopy(methodId);
    shipMsg.hidden = false;
    shipMsg.textContent = t(copy.fr, copy.en);

    clearCartIfConfirmed();
  }

  function showAltState(kind, titleFr, titleEn, msgFr, msgEn) {
    panel.classList.toggle("is-waiting", kind === "waiting");
    panel.classList.toggle("is-failed", kind === "failed");
    hero.hidden = true;
    headingAlt.hidden = false;
    details.hidden = true;
    setTitle(titleFr, titleEn);
    setStatus(msgFr, msgEn);
  }

  // Règle critique : sans session_id → JAMAIS « payé »
  if (!sessionId) {
    showAltState(
      "failed",
      "Paiement non confirmé",
      "Payment not confirmed",
      "Nous n’avons pas pu vérifier cette commande. Ouvrir cette page ne signifie pas que le paiement a été effectué.",
      "We could not verify this order. Opening this page does not mean payment was completed.",
    );
    return;
  }

  const cfg = window.BOREALES_CHECKOUT || {};
  const apiBase = (cfg.apiBase || "").replace(/\/$/, "");
  if (!apiBase) {
    showAltState(
      "failed",
      "Vérification impossible",
      "Unable to verify",
      "La vérification du paiement est temporairement indisponible. Réessayez plus tard ou contactez-nous.",
      "Payment verification is temporarily unavailable. Please try again later or contact us.",
    );
    return;
  }

  setStatus("Vérification de votre paiement…", "Verifying your payment…");

  let attempts = 0;
  const maxAttempts = 8;
  let lastConfirmed = null;

  async function poll() {
    attempts++;
    try {
      const res = await fetch(
        apiBase + "/api/order-status?session_id=" + encodeURIComponent(sessionId),
        { headers: { Accept: "application/json" }, cache: "no-store" },
      );
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Erreur statut");

      if (data.confirmed === true && data.ui_state === "confirmed") {
        lastConfirmed = data;
        showConfirmed(data);
        return;
      }

      if (data.ui_state === "failed" || data.ui_state === "canceled" || data.ui_state === "expired") {
        showAltState(
          "failed",
          "Paiement non réussi",
          "Payment unsuccessful",
          "Le paiement n’a pas été confirmé. Votre panier est conservé s’il est encore présent.",
          "Payment was not confirmed. Your cart is kept if it is still present.",
        );
        return;
      }

      showAltState(
        "waiting",
        "Paiement en cours de vérification",
        "Payment being verified",
        attempts < maxAttempts
          ? "Nous confirmons votre paiement. Cela peut prendre quelques instants…"
          : "La confirmation prend plus de temps que prévu. Réessayez dans un moment ou contactez-nous si le montant a été débité.",
        attempts < maxAttempts
          ? "We are confirming your payment. This may take a moment…"
          : "Confirmation is taking longer than expected. Try again shortly, or contact us if you were charged.",
      );
      if (attempts < maxAttempts) setTimeout(poll, 2000);
    } catch (e) {
      showAltState(
        "failed",
        "Vérification interrompue",
        "Verification interrupted",
        "Impossible de vérifier le paiement pour le moment. Réessayez quand le service est disponible.",
        "Unable to verify payment right now. Please retry when the service is available.",
      );
    }
  }

  window.addEventListener("boreales-lang-changed", () => {
    if (lastConfirmed) showConfirmed(lastConfirmed);
  });

  poll();
})();
</script>
</body>
</html>
